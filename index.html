<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Car Jump Parkour - Ultimate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#fff;font-family:'Orbitron',sans-serif;overflow:hidden;touch-action:none}
  #gameWrap{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column}
  canvas{flex:1;width:100%;background:linear-gradient(#1a1a3a 0%, #2d1b4e 40%, #0f0f1e 100%);display:block}
  #ui{position:absolute;top:0;left:0;width:100%;padding:12px 18px;display:flex;justify-content:space-between;z-index:10}
  #score{font-size:22px;text-shadow:0 0 10px #00ffff}
  #best{font-size:14px;opacity:0.7}
  #carSelect{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;background:rgba(0,0,0,0.6);padding:10px 14px;border-radius:30px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1)}
  .carBtn{width:54px;height:54px;border-radius:14px;border:2px solid transparent;background:#222;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.2s;font-size:26px}
  .carBtn.active{border-color:#00ffff;box-shadow:0 0 15px #00ffff;transform:scale(1.15)}
  #startScreen{position:absolute;inset:0;background:rgba(5,5,15,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
  #startScreen h1{font-size:42px;background:linear-gradient(90deg,#00ffff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .btn{margin-top:18px;padding:14px 36px;border:none;border-radius:30px;background:linear-gradient(90deg,#00ffff,#7a00ff);color:#fff;font-family:'Orbitron';font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="c"></canvas>
  <div id="ui"><div><div id="score">0 m</div><div id="best">BEST: 0</div></div><div id="speed">SPEED: 0</div></div>
  <div id="carSelect">
    <div class="carBtn active" data-car="0">🏎️</div>
    <div class="carBtn" data-car="1">🚙</div>
    <div class="carBtn" data-car="2">🚚</div>
    <div class="carBtn" data-car="3">🏁</div>
  </div>
  <div id="startScreen">
    <h1>CAR JUMP</h1><p style="color:#00ffff">PARKOUR EDITION</p><p>Har Model Ki Car • Jump Karke Paar Karo</p>
    <button class="btn" id="playBtn">▶ PLAY</button>
    <div style="margin-top:10px;font-size:13px;opacity:0.6">SPACE / TAP = JUMP • Double Tap = Super Jump</div>
  </div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;function resize(){DPR=devicePixelRatio||1;W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}window.addEventListener('resize',resize);resize();
const CARS=[{name:'Sports',color:'#00ffff',secondary:'#0088ff',w:70,h:26,wheel:12},{name:'Thar',color:'#ffaa00',secondary:'#ff4400',w:68,h:30,wheel:14},{name:'Truck',color:'#ff0040',secondary:'#990022',w:80,h:32,wheel:14},{name:'F1',color:'#ffffff',secondary:'#ff00ff',w:85,h:22,wheel:10}];
let selectedCar=0;document.querySelectorAll('.carBtn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.carBtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedCar=parseInt(b.dataset.car);if(game)game.car.type=CARS[selectedCar];};});
let game=null;
class Game{constructor(){this.reset();}reset(){this.car={x:120,y:0,vy:0,onGround:true,type:CARS[selectedCar],jumpPower:-16,gravity:0.75};this.groundY=H-110;this.car.y=this.groundY-this.car.type.h-12;this.obstacles=[];this.particles=[];this.clouds=[...Array(5)].map(()=>({x:Math.random()*W,y:50+Math.random()*120,s:0.2+Math.random()*0.8,w:60+Math.random()*80}));this.score=0;this.best=parseInt(localStorage.getItem('carJumpBest')||0);this.speed=6;this.spawnTimer=0;this.running=true;this.frame=0;document.getElementById('best').textContent='BEST: '+this.best;}jump(force=1){if(this.car.onGround){this.car.vy=this.car.jumpPower*(force>1?1.35:1);this.car.onGround=false;for(let i=0;i<8;i++)this.particles.push({x:this.car.x+10,y:this.groundY-2,vx:-2+Math.random()*2,vy:-3-Math.random()*3,life:20,c:'#aaa'});}}update(){if(!this.running)return;this.frame++;this.car.vy+=this.car.gravity;this.car.y+=this.car.vy;if(this.car.y>=this.groundY-this.car.type.h-12){this.car.y=this.groundY-this.car.type.h-12;this.car.vy=0;this.car.onGround=true;}this.spawnTimer--;if(this.spawnTimer<=0){let types=['block','spike','gap','ramp'];let t=types[Math.floor(Math.random()*types.length)];let w=t==='gap'?90:30+Math.random()*50;let h=t==='block'?35+Math.random()*40:t==='spike'?45:20;this.obstacles.push({x:W+20,w,h,type:t,passed:false});this.spawnTimer=80+Math.random()*60-this.speed*2;}for(let o of this.obstacles)o.x-=this.speed;this.obstacles=this.obstacles.filter(o=>o.x>-100);this.score+=this.speed*0.1;this.speed+=0.002;document.getElementById('score').textContent=Math.floor(this.score)+' m';document.getElementById('speed').textContent='SPEED: '+this.speed.toFixed(1);if(this.score>this.best){this.best=Math.floor(this.score);localStorage.setItem('carJumpBest',this.best);document.getElementById('best').textContent='BEST: '+this.best;}for(let o of this.obstacles){if(o.type==='gap'){if(this.car.onGround&&this.car.x+this.car.type.w>o.x&&this.car.x<o.x+o.w){this.gameOver();}}else{let carL=this.car.x+8,carR=this.car.x+this.car.type.w-8,carT=this.car.y,carB=this.car.y+this.car.type.h;let obsL=o.x,obsR=o.x+o.w,obsT=this.groundY-o.h,obsB=this.groundY;if(carR>obsL&&carL<obsR&&carB>obsT){this.gameOver();}}}for(let c of this.clouds){c.x-=c.s;if(c.x<-100)c.x=W+100;}for(let p of this.particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;}this.particles=this.particles.filter(p=>p.life>0);}gameOver(){this.running=false;setTimeout(()=>{document.getElementById('startScreen').style.display='flex';document.getElementById('startScreen').querySelector('h1').textContent='GAME OVER';document.getElementById('playBtn').textContent='↻ RETRY - '+Math.floor(this.score)+'m';},200);for(let i=0;i<20;i++)this.particles.push({x:this.car.x+this.car.type.w/2,y:this.car.y+this.car.type.h/2,vx:-5+Math.random()*10,vy:-8+Math.random()*4,life:30,c:CARS[selectedCar].color});}draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.08)';for(let c of this.clouds){ctx.fillRect(c.x,c.y,c.w,12);ctx.fillRect(c.x+10,c.y-6,c.w-20,8);}ctx.fillStyle='#111122';ctx.fillRect(0,this.groundY,W,H-this.groundY);ctx.fillStyle='#00ffff';ctx.fillRect(0,this.groundY,W,2);ctx.strokeStyle='rgba(0,255,255,0.1)';for(let x=-(this.frame*this.speed)%40;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,this.groundY);ctx.lineTo(x+20,H);ctx.stroke();}for(let o of this.obstacles){if(o.type==='gap'){ctx.fillStyle='#000';ctx.fillRect(o.x,this.groundY,o.w,H-this.groundY);ctx.fillStyle='#ff0040';ctx.fillRect(o.x,this.groundY,4,12);ctx.fillRect(o.x+o.w-4,this.groundY,4,12);}else if(o.type==='spike'){ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.moveTo(o.x,this.groundY);ctx.lineTo(o.x+o.w/2,this.groundY-o.h);ctx.lineTo(o.x+o.w,this.groundY);ctx.closePath();ctx.fill();}else{ctx.fillStyle='#444466';ctx.fillRect(o.x,this.groundY-o.h,o.w,o.h);ctx.fillStyle='#00ffff';ctx.fillRect(o.x,this.groundY-o.h,o.w,3);}}ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.ellipse(this.car.x+this.car.type.w/2,this.groundY+2,this.car.type.w/2,6,0,0,Math.PI*2);ctx.fill();let car=this.car;let tilt=car.onGround?0:car.vy*0.04;ctx.save();ctx.translate(car.x+car.type.w/2,car.y+car.type.h/2);ctx.rotate(tilt);ctx.translate(-car.type.w/2,-car.type.h/2);ctx.fillStyle=car.type.color;ctx.beginPath();ctx.roundRect(0,0,car.type.w,car.type.h,6);ctx.fill();ctx.fillStyle=car.type.secondary;ctx.fillRect(car.type.w*0.35,3,car.type.w*0.4,car.type.h*0.6);ctx.fillStyle='#111';ctx.beginPath();ctx.arc(16,car.type.h-2,car.type.wheel/2+2,0,Math.PI*2);ctx.arc(car.type.w-16,car.type.h-2,car.type.wheel/2+2,0,Math.PI*2);ctx.fill();if(!car.onGround){ctx.fillStyle='#00ffff';ctx.fillRect(-14,car.type.h/2-4,14,8);}ctx.restore();for(let p of this.particles){ctx.globalAlpha=p.life/30;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);}ctx.globalAlpha=1;}}
function loop(){if(game){game.update();game.draw();}requestAnimationFrame(loop);}loop();
document.getElementById('playBtn').onclick=()=>{document.getElementById('startScreen').style.display='none';game=new Game();};
let lastTap=0;function doJump(e){if(e)e.preventDefault();let now=Date.now();let isDouble=now-lastTap<300;lastTap=now;if(game&&game.running)game.jump(isDouble?2:1);else if(!game||!game.running){document.getElementById('playBtn').click();}}
window.addEventListener('keydown',e=>{if(e.code==='Space')doJump();});canvas.addEventListener('touchstart',doJump,{passive:false});canvas.addEventListener('mousedown',doJump);
</script>
</body>
</html>
